<!DOCTYPE html>
<html>
<head>
    <title>New Invoice Entry</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 60px auto; }
        label { display: block; margin-top: 14px; font-weight: 600; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; background: #2563eb; color: white;
                 border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>New Invoice Entry</h2>
    <form method="post" action="/form/submit">
        <label for="company">Company</label>
        <input type="text" id="company" name="company" required>

        <label for="invoice_number">Invoice Number</label>
        <input type="text" id="invoice_number" name="invoice_number">

        <label for="amount">Amount</label>
        <input type="number" step="0.01" id="amount" name="amount" required>

        <label for="due_date">Due Date</label>
        <input type="text" id="due_date" name="due_date" required placeholder="YYYY-MM-DD">

        <button type="submit" id="submit-btn">Submit</button>
    </form>
</body>
</html>
