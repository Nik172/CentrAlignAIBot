<!DOCTYPE html>
<html>
<head>
    <title>Internal Invoice System</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
        th { background: #f4f4f4; }
        a.button { display: inline-block; padding: 8px 16px; background: #2563eb; color: white;
                   text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>📋 Internal Invoice System</h1>
    <a class="button" href="/form">+ New Invoice Entry</a>
    <table>
        <tr>
            <th>ID</th><th>Company</th><th>Invoice #</th><th>Amount</th><th>Due Date</th><th>Status</th><th>Created</th>
        </tr>
        {% for inv in invoices %}
        <tr>
            <td>{{ inv.id }}</td>
            <td>{{ inv.company }}</td>
            <td>{{ inv.invoice_number }}</td>
            <td>₹{{ inv.amount }}</td>
            <td>{{ inv.due_date }}</td>
            <td>{{ inv.status }}</td>
            <td>{{ inv.created_at }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
